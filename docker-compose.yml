services:
  # 1. Zookeeper (기존 유지)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - ./zookeeper_data:/var/lib/zookeeper/data
      - ./zookeeper_log:/var/lib/zookeeper/log

  # 2. Kafka (기존 유지)
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Phase 1 (docs/EXPANSION_PLAN.md): 새로 생성되는 토픽의 기본 파티션 수. 이미 존재하는
      # flight_data_raw 토픽에는 소급 적용되지 않으므로, 기존 토픽은 `kafka-topics --alter`로 늘려야 함.
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 1 
      KAFKA_LOG_RETENTION_BYTES: 536870912  # 512MB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

  # 3. MinIO (New! - AWS S3 역할을 하는 저장소)
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. PostgreSQL (New! - 웹 서비스용 DB)
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-flightdb}
    volumes:
      - pg_data:/var/lib/postgresql/data

  # 5. MinIO 버킷 초기화 (data lake 버킷을 미리 만들어둠 - 없으면 Spark 저장이 계속 실패함)
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin}; do
        echo 'Waiting for minio...'; sleep 2;
      done;
      mc mb -p local/flight-data-lake;
      exit 0;
      "

  # 6. Producer (New! - OpenSky 데이터 수집기, 상시 실행)
  producer:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: producer
    command: >
      bash -c "
      until python -c 'import socket; s = socket.socket(); s.connect((\"kafka\", 29092))' 2>/dev/null; do
        echo 'Waiting for kafka...'; sleep 2;
      done;
      python src/producer.py
      "
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OPENSKY_USER=${OPENSKY_USER:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
    depends_on:
      - kafka

  # 7. Spark 상주 스트리밍 잡 (New! - Kafka -> Postgres/MinIO Dual Write)
  spark:
    build: .
    container_name: spark
    command: >
      bash -c "
      until python -c 'import socket; s = socket.socket(); s.connect((\"kafka\", 29092))' 2>/dev/null; do
        echo 'Waiting for kafka...'; sleep 2;
      done;
      /home/airflow/.local/bin/spark-submit \
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.6.0 \
      /opt/airflow/src/spark_dual_write.py
      "
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-flightdb}
      # 콜드 패스 적재 경로. 기본값이 실데이터 경로다.
      # 합성 부하 테스트(scripts/load_test_producer.py)는 같은 Kafka 토픽을 쓰므로,
      # 가짜 레코드가 학습 데이터(docs/EXPANSION_PLAN.md 0.4)에 섞이지 않도록
      # 테스트 시에만 경로를 덮어쓴다:
      #   MINIO_COLD_PATH=s3a://flight-data-lake/synthetic docker compose up -d spark
      - MINIO_COLD_PATH=${MINIO_COLD_PATH:-s3a://flight-data-lake/raw_data}
      # 콜드 패스 트리거 간격. 핫 패스(10초)와 분리돼 있어 길게 잡을수록
      # Parquet 파일이 크고 적게 생긴다 (300초 = 배치당 30배 적은 파일).
      - COLD_TRIGGER=${COLD_TRIGGER:-300 seconds}
    # 2026-09-09 spark가 OOMKilled(exit 137)로 죽었는데, 한도가 없어서 "spark 자체가
    # 자란 것"인지 "Docker VM 전체가 압박받은 것"인지 구분할 수 없었다. 한도를 명시해야
    # OOM이 재현 가능하고 귀속 가능한 사건이 된다. 실측 최대치가 1,213MiB(20배 부하,
    # 30분)였으므로 여유를 두고 2g. 이 값을 넘겨 죽으면 원인이 spark로 특정된다.
    mem_limit: 2g
    volumes:
      - ./src:/opt/airflow/src
      # 컨테이너 재시작 시 체크포인트가 유실되면 Kafka earliest offset부터 전체 재처리되어
      # 이미 적재된 데이터가 중복 저장됨 - 호스트에 마운트해서 재시작 간 이어서 처리되게 함
      - ./checkpoints/spark_checkpoints_final:/tmp/spark_checkpoints_final
      # 콜드 패스는 별도 스트리밍 쿼리라 체크포인트도 따로다. 마운트하지 않으면
      # spark 재시작 때마다 Kafka earliest부터 다시 읽어 학습 데이터에 중복이 쌓인다
      # (핫 패스가 2026-08-20에 겪은 것과 같은 문제).
      - ./checkpoints/spark_checkpoints_cold:/tmp/spark_checkpoints_cold
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # 8. FastAPI 백엔드 (New! - 프론트엔드에 최신 항공기 위치 서빙)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: backend
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-flightdb}
    depends_on:
      - postgres

  # [여기서부터 추가] Airflow 섹션
  airflow:
    build: .
    container_name: airflow
    # [수정] 명령어를 더 명확하고 견고하게 분리 (| 사용)
    command: |
      bash -c "
      echo 'Waiting for airflow-postgres...'
      until python -c 'import socket; s = socket.socket(); s.connect((\"airflow-postgres\", 5432))' 2>/dev/null; do
        sleep 1
      done
      echo 'Initializing database...'
      airflow db migrate
      echo 'Creating admin user...'
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true
      echo 'Starting scheduler and webserver...'
      airflow scheduler &
      exec airflow webserver
      "
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_VAR_MINIO_ENDPOINT=http://minio:9000
      - AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-flightdb}
      - DB_HOST=postgres
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-postgres
      - kafka
      - minio

  # Airflow 전용 메타데이터 DB
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5433:5432"

volumes:
  minio_data:
    driver: local
  pg_data:
    driver: local
