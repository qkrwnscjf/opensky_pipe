services:
  # 1. Zookeeper (기존 유지)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    # 세션 휘발 스토어 (docs/EXPANSION_PLAN.md 0.4). 익명 볼륨이라 컨테이너가
    # 새로 만들어질 때(= docker compose down 후 up) 빈 상태로 시작한다.
    # 세션 '중'의 재시작에서는 같은 컨테이너를 다시 띄우므로 데이터가 유지된다.
    volumes:
      - /var/lib/zookeeper/data
      - /var/lib/zookeeper/log

  # 2. Kafka (기존 유지)
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    # 세션 휘발 (0.4). Zookeeper와 짝으로 비워져야 cluster ID가 어긋나지 않는다.
    volumes:
      - /var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Phase 1 (docs/EXPANSION_PLAN.md): 새로 생성되는 토픽의 기본 파티션 수. 이미 존재하는
      # flight_data_raw 토픽에는 소급 적용되지 않으므로, 기존 토픽은 `kafka-topics --alter`로 늘려야 함.
      KAFKA_NUM_PARTITIONS: 6
      # retention 1 → 3시간 (2026-09-10, A-3 하위 항목 재검토).
      #
      # 존재 근거가 Phase 1-2에서 바뀌었다. 원래는 "체크포인트가 retention보다 오래
      # 살아남는" 세션 '간' 문제와 얽혀 있었는데, 세션 시작 초기화로 체크포인트와
      # Kafka가 항상 함께 비워지므로 그 축은 사라졌다.
      #
      # 지금 이 값이 결정하는 건 하나뿐이다 — 세션 '내' spark 다운타임을 얼마나
      # 견디는가. 이를 넘기면 콜드 패스(B-2 학습 데이터)에 **영구적인 구멍**이 생긴다.
      #
      # 1시간이 위험한 시나리오가 실제로 있었다: 익명 볼륨 소유권 버그로 spark가
      # 크래시 루프에 빠져 11분간 RestartCount 43을 기록했다(2026-09-09).
      # restart: unless-stopped로 단발 크래시는 몇 분 안에 복구되지만 루프는 다르다.
      #
      # 비용은 실측 기준 시간당 약 14MB이므로 3시간이면 세션당 약 42MB.
      # Kafka 데이터는 세션마다 초기화돼 누적되지 않는다. 부족하면 더 늘린다.
      KAFKA_LOG_RETENTION_HOURS: 3
      # 파티션당 상한(백스톱). 현재 파티션당 약 2.3MB/시간이라 시간 조건이 먼저
      # 걸린다. B-1로 트래픽이 수십 배가 되면 이쪽이 병목이 되므로 재산정 필요.
      KAFKA_LOG_RETENTION_BYTES: 536870912  # 512MB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000

  # 2.5 Kafka 토픽 사전 생성 (minio-init과 같은 패턴)
  #
  # 없으면 파이프라인이 아예 못 뜨는 경우가 있다. Phase 1-2 세션 초기화로 Kafka는
  # 매 세션 토픽 0개로 시작하는데, 토픽은 producer가 첫 메시지를 보낼 때 자동
  # 생성된다. 그래서 producer가 OpenSky에 접근하지 못하면(429 일일 한도 소진,
  # API 장애, 네트워크 단절) 토픽이 영영 안 만들어지고, spark가 없는 토픽을
  # 구독하다 UnknownTopicOrPartitionException으로 죽는다.
  # restart: unless-stopped가 붙어 있어 그대로 크래시 루프가 된다.
  # (2026-09-10 실제 발생 — 429 상태에서 세션을 재시작하다 재현)
  #
  # Phase 1-2 이전에는 Kafka 데이터가 바인드 마운트라 토픽이 세션을 넘어 살아남아
  # 드러나지 않던 문제다. 하드 제약 0.1("docker compose up 한 번으로 자동 기동")을
  # 지키려면 수집 소스의 상태와 무관하게 토픽이 있어야 한다.
  #
  # 파티션 수를 여기서 명시하는 것이 브로커 기본값(KAFKA_NUM_PARTITIONS)에
  # 의존하는 것보다 낫다 — 자동 생성 시점의 기본값에 좌우되지 않는다.
  kafka-init:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: >
      /bin/sh -c "
      until kafka-broker-api-versions --bootstrap-server kafka:29092 > /dev/null 2>&1; do
        echo 'Waiting for kafka...'; sleep 2;
      done;
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic flight_data_raw --partitions 6 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:29092 --describe --topic flight_data_raw;
      exit 0;
      "

  # 3. MinIO (New! - AWS S3 역할을 하는 저장소)
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. PostgreSQL (New! - 웹 서비스용 DB)
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-flightdb}
    # 세션 휘발 (0.4). flight_data 테이블은 Spark JDBC writer가 첫 append 때
    # 자동 생성하고, 인덱스는 ensure_index()가 만들므로 빈 DB로 시작해도 된다.
    volumes:
      - /var/lib/postgresql/data

  # 5. MinIO 버킷 초기화 (data lake 버킷을 미리 만들어둠 - 없으면 Spark 저장이 계속 실패함)
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASSWORD:-minioadmin}; do
        echo 'Waiting for minio...'; sleep 2;
      done;
      mc mb -p local/flight-data-lake;
      exit 0;
      "

  # 6. Producer (New! - OpenSky 데이터 수집기, 상시 실행)
  producer:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: producer
    restart: unless-stopped
    command: >
      bash -c "
      until python -c 'import socket; s = socket.socket(); s.connect((\"kafka\", 29092))' 2>/dev/null; do
        echo 'Waiting for kafka...'; sleep 2;
      done;
      python src/producer.py
      "
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OPENSKY_USER=${OPENSKY_USER:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
    depends_on:
      - kafka

  # 7. Spark 상주 스트리밍 잡 (New! - Kafka -> Postgres/MinIO Dual Write)
  spark:
    build: .
    container_name: spark
    # 크래시(2026-09-09 OOM 등) 시 자동 복구. 중요한 건 '같은 컨테이너를 다시
    # 띄운다'는 점이다 — 익명 볼륨의 체크포인트가 유지되므로 Kafka를 처음부터
    # 다시 읽어 콜드 패스에 중복을 쌓는 일이 없다. 수동 재생성(up --build)만
    # 볼륨을 새로 만든다.
    restart: unless-stopped
    command: >
      bash -c "
      until python -c 'import socket; s = socket.socket(); s.connect((\"kafka\", 29092))' 2>/dev/null; do
        echo 'Waiting for kafka...'; sleep 2;
      done;
      /home/airflow/.local/bin/spark-submit \
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.6.0 \
      /opt/airflow/src/spark_dual_write.py
      "
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-flightdb}
      # 콜드 패스 적재 경로. 기본값이 실데이터 경로다.
      # 합성 부하 테스트(scripts/load_test_producer.py)는 같은 Kafka 토픽을 쓰므로,
      # 가짜 레코드가 학습 데이터(docs/EXPANSION_PLAN.md 0.4)에 섞이지 않도록
      # 테스트 시에만 경로를 덮어쓴다:
      #   MINIO_COLD_PATH=s3a://flight-data-lake/synthetic docker compose up -d spark
      - MINIO_COLD_PATH=${MINIO_COLD_PATH:-s3a://flight-data-lake/raw_data}
      # 콜드 패스 트리거 간격. 핫 패스(10초)와 분리돼 있어 길게 잡을수록
      # Parquet 파일이 크고 적게 생긴다 (300초 = 배치당 30배 적은 파일).
      - COLD_TRIGGER=${COLD_TRIGGER:-300 seconds}
    # 2026-09-09 spark가 OOMKilled(exit 137)로 죽었는데, 한도가 없어서 "spark 자체가
    # 자란 것"인지 "Docker VM 전체가 압박받은 것"인지 구분할 수 없었다. 한도를 명시해야
    # OOM이 재현 가능하고 귀속 가능한 사건이 된다. 실측 최대치가 1,213MiB(20배 부하,
    # 30분)였으므로 여유를 두고 2g. 이 값을 넘겨 죽으면 원인이 spark로 특정된다.
    mem_limit: 2g
    volumes:
      - ./src:/opt/airflow/src
      # 체크포인트가 유실되면 Kafka earliest부터 전체 재처리되어 이미 적재된 데이터가
      # 중복 저장된다(2026-08-20 실측: 761~945건 배치). 익명 볼륨은 '같은 컨테이너
      # 재시작'에서는 유지되므로 그 사고를 막고, '컨테이너 재생성'에서만 비워진다.
      #
      # 체크포인트는 Kafka 데이터와 '짝'이다. Kafka를 비우면 오프셋이 0부터
      # 다시 매겨지므로, 이전 세션의 높은 오프셋을 가리키는 체크포인트가 남아
      # 있으면 어긋난다. 그래서 둘을 같은 수명(익명 볼륨)으로 묶는다.
      - /tmp/spark_checkpoints_final
      # 콜드 패스는 별도 스트리밍 쿼리라 체크포인트도 따로다. 세션 '중'에 spark를
      # 재빌드(up --build)하면 컨테이너가 새로 만들어져 이 볼륨이 비고, Kafka에
      # 남아있는 최대 1시간치를 콜드 패스에 다시 쓴다 → 학습 데이터에 중복.
      # 세션 중에는 재빌드 대신 `docker compose restart spark`를 쓸 것.
      - /tmp/spark_checkpoints_cold
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  # 8. FastAPI 백엔드 (New! - 프론트엔드에 최신 항공기 위치 서빙)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: backend
    restart: unless-stopped
    command: uvicorn src.backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-flightdb}
    depends_on:
      - postgres

  # [여기서부터 추가] Airflow 섹션
  airflow:
    build: .
    container_name: airflow
    # [수정] 명령어를 더 명확하고 견고하게 분리 (| 사용)
    command: |
      bash -c "
      echo 'Waiting for airflow-postgres...'
      until python -c 'import socket; s = socket.socket(); s.connect((\"airflow-postgres\", 5432))' 2>/dev/null; do
        sleep 1
      done
      echo 'Initializing database...'
      airflow db migrate
      echo 'Creating admin user...'
      airflow users create --username admin --firstname admin --lastname admin --role Admin --email admin@example.com --password admin || true
      echo 'Starting scheduler and webserver...'
      airflow scheduler &
      exec airflow webserver
      "
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_VAR_MINIO_ENDPOINT=http://minio:9000
      - AIRFLOW_VAR_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ACCESS_KEY=${MINIO_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-minioadmin}
      - DB_USER=${DB_USER:-myuser}
      - DB_PASSWORD=${DB_PASSWORD:-mypassword}
      - DB_NAME=${DB_NAME:-flightdb}
      - DB_HOST=postgres
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    depends_on:
      - airflow-postgres
      - kafka
      - minio

  # Airflow 전용 메타데이터 DB
  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5433:5432"

volumes:
  # 유일한 영구 저장소. B-2(궤적 예측) 학습 데이터의 원천이므로 세션을 넘어
  # 보존된다. 나머지 스토어는 전부 익명 볼륨으로 세션마다 비워진다 (0.4).
  minio_data:
    driver: local
