version: '3'

services:
  # 1. Zookeeper (기존 유지)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. Kafka (기존 유지)
  kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 3. MinIO (New! - AWS S3 역할을 하는 저장소)
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" # API 포트 (Spark가 여기로 데이터 보냄)
      - "9001:9001" # 관리자 콘솔 포트 (웹에서 파일 확인용)
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}      # AWS Access Key 역할
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD} # AWS Secret Key 역할
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 4. PostgreSQL (New! - 웹 서비스용 DB)
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}         # DB 아이디
      POSTGRES_PASSWORD: ${DB_PASSWORD} # DB 비밀번호
      POSTGRES_DB: ${DB_NAME}        # DB 이름
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  minio_data:
    driver: local
  pg_data:
    driver: local